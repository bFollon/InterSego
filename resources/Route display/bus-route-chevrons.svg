<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 50" width="400" height="200">
  <!-- Background for visibility (remove in production) -->
  <rect width="100" height="50" fill="#f5f5f5"/>
  
  <!-- START CHEVRON (Downward pointing) -->
  <g id="start-chevron" transform="translate(25, 25)">
    <!-- Downward chevron V shape -->
    <path d="M -8,-4 L 0,4 L 8,-4" 
          stroke="#1976D2" 
          stroke-width="4" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none"/>
    
    <!-- Vertical line extending downward from bottom tip -->
    <rect x="-2" y="4" width="4" height="8" fill="#1976D2"/>
  </g>
  
  <!-- END CHEVRON (Upward pointing) -->
  <g id="end-chevron" transform="translate(75, 25)">
    <!-- Upward chevron ^ shape -->
    <path d="M -8,4 L 0,-4 L 8,4" 
          stroke="#1976D2" 
          stroke-width="4" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none"/>
    
    <!-- Vertical line extending upward from top tip -->
    <rect x="-2" y="-12" width="4" height="8" fill="#1976D2"/>
  </g>
  
  <!-- Labels -->
  <text x="25" y="45" text-anchor="middle" font-family="Arial" font-size="6" fill="#666">START</text>
  <text x="75" y="45" text-anchor="middle" font-family="Arial" font-size="6" fill="#666">END</text>
</svg>
