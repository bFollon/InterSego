<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Background -->
  <rect width="1024" height="1024" fill="#1976D2"/>
  
  <!-- Segovia Aqueduct - large background element with proper arches -->
  <g opacity="0.15">
    <!-- Bottom tier structure -->
    <!-- Left pillar -->
    <rect x="100" y="500" width="35" height="450" fill="#FFFFFF"/>
    <!-- First arch (inverted semicircle on top) -->
    <path d="M 135 500 Q 230 350 325 500" fill="none" stroke="#FFFFFF" stroke-width="30"/>
    <!-- Second pillar -->
    <rect x="325" y="500" width="35" height="450" fill="#FFFFFF"/>
    <!-- Second arch -->
    <path d="M 360 500 Q 455 350 550 500" fill="none" stroke="#FFFFFF" stroke-width="30"/>
    <!-- Third pillar -->
    <rect x="550" y="500" width="35" height="450" fill="#FFFFFF"/>
    <!-- Third arch -->
    <path d="M 585 500 Q 680 350 775 500" fill="none" stroke="#FFFFFF" stroke-width="30"/>
    <!-- Right pillar -->
    <rect x="775" y="500" width="35" height="450" fill="#FFFFFF"/>
    
    <!-- Upper tier structure (smaller, centered between lower pillars) -->
    <!-- Left upper pillar -->
    <rect x="210" y="300" width="28" height="200" fill="#FFFFFF"/>
    <!-- First upper arch -->
    <path d="M 238 300 Q 310 200 382 300" fill="none" stroke="#FFFFFF" stroke-width="24"/>
    <!-- Middle upper pillar -->
    <rect x="382" y="300" width="28" height="200" fill="#FFFFFF"/>
    <!-- Second upper arch -->
    <path d="M 410 300 Q 482 200 554 300" fill="none" stroke="#FFFFFF" stroke-width="24"/>
    <!-- Right upper pillar -->
    <rect x="554" y="300" width="28" height="200" fill="#FFFFFF"/>
    <!-- Third upper arch -->
    <path d="M 582 300 Q 654 200 726 300" fill="none" stroke="#FFFFFF" stroke-width="24"/>
    <!-- Far right upper pillar -->
    <rect x="726" y="300" width="28" height="200" fill="#FFFFFF"/>
    
    <!-- Base platform -->
    <rect x="80" y="950" width="850" height="35" fill="#FFFFFF"/>
  </g>
  
  <!-- Bus simplified shape (now in front of aqueduct) -->
  <g transform="translate(512, 512) scale(14)">
    <!-- Main bus body -->
    <rect x="-20" y="-18" width="40" height="32" rx="4" fill="#FFFFFF"/>
    
    <!-- Windshield -->
    <rect x="-16" y="-14" width="32" height="12" rx="2" fill="#1976D2"/>
    
    <!-- Bus windows split -->
    <line x1="0" y1="-14" x2="0" y2="-2" stroke="#FFFFFF" stroke-width="1.5"/>
    
    <!-- Wheels -->
    <circle cx="-12" cy="16" r="4" fill="#424242"/>
    <circle cx="12" cy="16" r="4" fill="#424242"/>
    <circle cx="-12" cy="16" r="2" fill="#757575"/>
    <circle cx="12" cy="16" r="2" fill="#757575"/>
    
    <!-- Time/Schedule indicator - Clock hand accent -->
    <g transform="translate(16, -16)">
      <!-- Small clock circle background -->
      <circle cx="0" cy="0" r="8" fill="#FF9800"/>
      <!-- Clock hands simplified -->
      <line x1="0" y1="0" x2="0" y2="-4" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="3" y2="0" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    
    <!-- Bottom detail line -->
    <line x1="-20" y1="3" x2="20" y2="3" stroke="#E0E0E0" stroke-width="1"/>
  </g>

</svg>
