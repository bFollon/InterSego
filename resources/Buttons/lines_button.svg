<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Bus line -->
  <line x1="10" y1="50" x2="90" y2="50"
        stroke="#3CA27A"
        stroke-width="6"
        stroke-linecap="round" />

  <!-- Bus stops (4 evenly distributed) -->
  <circle cx="10" cy="50" r="6" fill="#3CA27A" />
  <circle cx="37" cy="50" r="6" fill="#3CA27A" />
  <circle cx="63" cy="50" r="6" fill="#3CA27A" />
  <circle cx="90" cy="50" r="6" fill="#3CA27A" />
</svg>
